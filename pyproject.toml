[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dynamic-memory-leak-tracker"
version = "0.1.0"
description = "Allocation profiler monitoring object reference graphs in long-running agent worker loops to pinpoint circular references and memory leaks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-dynamic-memory-leak-tracker = "agent_dynamic_memory_leak_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_dynamic_memory_leak_tracker*"]
